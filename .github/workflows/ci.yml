name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Spelled out rather than read from package.json's packageManager
          # field, so a failure here is a version change and nothing subtler.
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck, unit tests, build, and the manifest checked against AMO's
      # rules. First, so that a failure here does not wait on a browser.
      - run: pnpm check

      - run: pnpm exec playwright install --with-deps chromium

      # The suite loads the extension into a headed Chromium, because Chromium
      # does not load extensions headless, and a runner has no display. Under a
      # virtual one it behaves the same as on a desk.
      - run: xvfb-run -a pnpm test:e2e

# Not run here: scripts/check-firefox.sh and scripts/check-package.sh. Both want
# a real Firefox, and the one on a runner arrives as a snap, whose confinement
# makes a throwaway profile awkward. They are release checks, run locally, and
# the README says so.
